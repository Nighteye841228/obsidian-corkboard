name: CI

on:
    push:
        branches: ["**"]
        tags-ignore: ["*"]  # release.yml handles tag pushes
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
            - name: Enable Corepack (provides pnpm via packageManager field)
              run: corepack enable
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm test
            - run: pnpm build
