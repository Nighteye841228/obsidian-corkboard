name: CI

on:
    push:
        branches: ["**"]
        tags-ignore: ["*"]  # release.yml handles tag pushes
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-24.04

        strategy:
            matrix:
                node-version: [24]

        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              # Version is taken from the `packageManager` field in
              # package.json — passing `version:` here too makes v6 abort
              # to prevent silent mismatches.
              uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d  # v6.0.5

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm test
            - run: pnpm build
