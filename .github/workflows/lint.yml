name: CI

on:
    push:
        branches: ["**"]
        tags-ignore: ["*"]  # release.yml handles tag pushes
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
            # Install pnpm via the Node-bundled npm. Avoids Corepack's shim
            # placement quirks on GitHub runners and avoids third-party
            # actions that still target Node 20. Version is pinned in
            # package.json (packageManager field); we just need a CLI here.
            - run: npm install -g pnpm@10.33.2
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm test
            - run: pnpm build
